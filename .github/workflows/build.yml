name: build

on:
  push:
    branches: [main]
    paths-ignore:
      - '**.md'
  pull_request:
    paths-ignore:
      - '**.md'
  workflow_dispatch:
    inputs:
      runner:
        description: "Runner label, for example self-hosted."
        type: string
        default: ubuntu-26.04

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  COMPARE: 0
  # Secure downloads from pinned commit SHAs
  PRET_ASSETS: https://raw.githubusercontent.com/pret/pokeheartgold/79948ad5db02cb4dc190dbaa0c4b7848279bc61c
  HG_ENGINE_ASSETS: https://raw.githubusercontent.com/BluRosie/hg-engine/9749e99e3d376fce6fa0e88061397bbe9dd65b41
  DECOMP_REF: 793ebe976cd99bbb3899ae6a8c8cac4ad0b7b50f

jobs:
  build:
    if: ${{ github.repository == 'BluRosie/hg-engine' || (github.event_name == 'workflow_dispatch' && github.repository != 'BluRosie/hg-engine') }}
    runs-on: ${{ inputs.runner || 'ubuntu-26.04' }}

    steps:
      - name: Restore base ROM cache
        id: base-rom
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: base-rom.nds
          key: ${{ runner.os }}-base-rom-heartgold-us-${{ env.DECOMP_REF }}

      - name: Add WineHQ apt repository
        if: steps.base-rom.outputs.cache-hit != 'true'
        env:
          WINEHQ_KEY_FINGERPRINT: D43F640145369C51D786DDEA76F1A20FF987672F
        run: |
          wget --quiet --output-document="$RUNNER_TEMP/winehq.key" https://dl.winehq.org/wine-builds/winehq.key
          # fails the step if the downloaded key is not the expected one
          gpg --show-keys --with-colons "$RUNNER_TEMP/winehq.key" | grep --quiet "$WINEHQ_KEY_FINGERPRINT"
          sudo install -D --mode=644 "$RUNNER_TEMP/winehq.key" /etc/apt/keyrings/winehq-archive.asc
          sudo tee /etc/apt/sources.list.d/winehq.sources > /dev/null <<EOF
          Types: deb
          URIs: https://dl.winehq.org/wine-builds/ubuntu
          Suites: $(lsb_release --codename --short)
          Components: main
          Architectures: amd64
          Signed-By: /etc/apt/keyrings/winehq-archive.asc
          EOF

      - name: Install decomp packages
        if: steps.base-rom.outputs.cache-hit != 'true'
        run: |
          sudo apt update
          sudo apt --yes install --install-recommends \
            7zip \
            binutils-arm-none-eabi \
            build-essential \
            libpng-dev \
            libpugixml-dev \
            pkg-config \
            winehq-stable

      - name: Checkout decomp
        if: steps.base-rom.outputs.cache-hit != 'true'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: "BluRosie/pokeheartgold"
          ref: ${{ env.DECOMP_REF }}
          path: pokeheartgold
          persist-credentials: false

      - name: Restore decomp toolchain cache
        if: steps.base-rom.outputs.cache-hit != 'true'
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            pokeheartgold/tools/mwccarm
            pokeheartgold/tools/bin
            pokeheartgold/sub/ARM7-TS.lcf.template
            pokeheartgold/ARM9-TS.lcf.template
            pokeheartgold/mwldarm.response.template
          key: ${{ runner.os }}-pokeheartgold-toolchain-mwccarm-nitrosdk-3_2-060901

      - name: Download decomp toolchain
        if: steps.base-rom.outputs.cache-hit != 'true'
        working-directory: pokeheartgold
        run: |
          mkdir --parents tools sub
          if [ ! -d tools/mwccarm ]; then
            wget --quiet --directory-prefix="$RUNNER_TEMP" "$PRET_ASSETS/mwccarm.zip"
            echo "dc386e37b2176e960954a733de928337d9b7e7620b9e94228008c31774339ace  $RUNNER_TEMP/mwccarm.zip" | sha256sum --check
            unzip -q -o "$RUNNER_TEMP/mwccarm.zip" -d tools
          fi
          if [ ! -d tools/bin ] || [ ! -f sub/ARM7-TS.lcf.template ] || [ ! -f ARM9-TS.lcf.template ] || [ ! -f mwldarm.response.template ]; then
            wget --quiet --directory-prefix="$RUNNER_TEMP" "$PRET_ASSETS/NitroSDK-3_2-060901.7z"
            echo "0ee935e34237cb1954e657083cd80a31ec9de1aeddd9468cceef684cac75b491  $RUNNER_TEMP/NitroSDK-3_2-060901.7z" | sha256sum --check
            7z x -y -o"$RUNNER_TEMP" "$RUNNER_TEMP/NitroSDK-3_2-060901.7z" > /dev/null
            sdk="$RUNNER_TEMP/NitroSDK-3_2-060901"
            rm --recursive --force tools/bin
            mv "$sdk/tools/bin" tools/
            cp "$sdk/include/nitro/specfiles/ARM7-TS.lcf.template" sub/
            cp "$sdk/include/nitro/specfiles/ARM9-TS.lcf.template" .
            cp "$sdk/include/nitro/specfiles/mwldarm.response.template" .
          fi

      - name: Build HeartGold (decomp)
        if: steps.base-rom.outputs.cache-hit != 'true'
        working-directory: pokeheartgold
        env:
          GAME_VERSION: HEARTGOLD
          GAME_LANGUAGE: ENGLISH
          GAME_REVISION: 0
          LM_LICENSE_FILE: "${{ github.workspace }}/pokeheartgold/tools/mwccarm/license.dat"
        run: |
          make --jobs=$(nproc)
          cp build/heartgold.us/pokeheartgold.us.nds ../base-rom.nds

      - name: Save base ROM cache
        if: steps.base-rom.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: base-rom.nds
          key: ${{ steps.base-rom.outputs.cache-primary-key }}

      # hg-engine: build and test in Docker
      - name: Checkout hg-engine
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: hg-engine
          submodules: recursive
          persist-credentials: false

      - name: Add base ROM and test save
        run: |
          echo "4fcded0e2713dc03929845de631d0932ea2b5a37  base-rom.nds" | sha1sum --check
          cp base-rom.nds hg-engine/rom.nds
          wget --quiet --directory-prefix=hg-engine "$HG_ENGINE_ASSETS/test.sav"
          echo "40306677b3d5723aaa78bca217596c43fc7149c1050d7bd9aae4aae952107939  hg-engine/test.sav" | sha256sum --check

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Build Docker image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: hg-engine
          tags: hg-engine
          load: true
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Restore Python cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: hg-engine/.venv
          key: ${{ runner.os }}-hg-engine-venv-${{ hashFiles('hg-engine/Dockerfile', 'hg-engine/requirements.txt') }}

      - name: Restore tool cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          key: ${{ runner.os }}-hg-engine-tools-${{ hashFiles('hg-engine/Dockerfile', 'hg-engine/Makefile', 'hg-engine/tools/source/**') }}
          path: |
            hg-engine/tools/msgenc
            hg-engine/tools/dsrom
            hg-engine/tools/armips
            hg-engine/tools/adpcm-xq
            hg-engine/tools/ntrWavTool.py
            hg-engine/tools/nitrogfx
            hg-engine/tools/movedatagen
            hg-engine/tools/pokedexdatagen
            hg-engine/tools/speciesdatagen
            hg-engine/tools/trainerdatagen
            hg-engine/tools/o2narc
            hg-engine/tools/jsonproc
            hg-engine/tools/ENCODE_IMG
            hg-engine/tools/btx

      - name: Build hg-engine
        working-directory: hg-engine
        run: |
          docker run \
            --cap-drop ALL \
            --env HOME=/tmp \
            --mount type=bind,source="$PWD",destination=/hg-engine \
            --rm \
            --security-opt no-new-privileges \
            --user "$(id -u):$(id -g)" \
            hg-engine make AUTO_TEST=Y --jobs=$(nproc)

      - name: "DEBUG: emulator check"
        working-directory: hg-engine
        timeout-minutes: 15
        run: |
          echo "runner: $(uname -m), $(nproc) cpus, $(grep -m 1 'model name' /proc/cpuinfo)"
          cat > debug_emulator.py <<'EOF'
          import importlib.metadata, platform, time
          from desmume.emulator import DeSmuME, DeSmuME_Memory

          ADDR = 0x02FFF81C
          print("python", platform.python_version(), platform.machine(), "py-desmume", importlib.metadata.version("py-desmume"), flush=True)
          emu = DeSmuME()
          hook_hits = []
          DeSmuME_Memory(emu).register_write(ADDR, lambda address, size: hook_hits.append(emu.memory.read(ADDR, ADDR, 4, True)))
          emu.open("test.nds")
          emu.backup.import_file("test.sav")
          for _ in range(120):
              emu.cycle(False)
          emu.memory.write_long(ADDR, 0 + (1 << 16))
          print("hook hits after our own write:", len(hook_hits), flush=True)

          last = None
          start = time.monotonic()
          for frame in range(60 * 120):
              emu.cycle(False)
              value = emu.memory.read(ADDR, ADDR, 4, True)
              if value != last:
                  print(f"frame {frame}: hole={value} hook_hits={len(hook_hits)}", flush=True)
                  last = value
              if frame % 600 == 0:
                  emu.screenshot().save(f"debug-{frame:05}.png")
          print(f"done: hook_hits={len(hook_hits)} values={hook_hits[:10]} speed={7200 / (time.monotonic() - start):.0f} fps", flush=True)
          EOF
          docker run \
            --cap-drop ALL \
            --env HOME=/tmp \
            --env PYTHONFAULTHANDLER=1 \
            --env SDL_VIDEODRIVER=dummy \
            --mount type=bind,source="$PWD",destination=/hg-engine \
            --rm \
            --security-opt no-new-privileges \
            --user "$(id -u):$(id -g)" \
            hg-engine sh -c '. .venv/bin/activate && python3 -u debug_emulator.py'

      - name: "DEBUG: kernel log and memory"
        if: always()
        run: |
          sudo dmesg | tail -n 30
          free --mega

      - name: "DEBUG: upload emulator screenshots"
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: emulator-debug
          path: hg-engine/debug-*.png
          retention-days: 1

      - name: Save test build cache
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            hg-engine/test.nds
            hg-engine/test.sav
            hg-engine/.venv
            hg-engine/build/battle_tests/test_manifest.json
            hg-engine/include/constants/generated/test_battle.h
          key: ${{ runner.os }}-test-build-${{ github.run_id }}

  test:
    needs: build
    runs-on: ${{ inputs.runner || 'ubuntu-26.04' }}
    strategy:
      fail-fast: false
      matrix:
        shard: [0, 1, 2, 3, 4]

    steps:
      - name: Checkout hg-engine
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: hg-engine
          persist-credentials: false

      - name: Restore test build cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            hg-engine/test.nds
            hg-engine/test.sav
            hg-engine/.venv
            hg-engine/build/battle_tests/test_manifest.json
            hg-engine/include/constants/generated/test_battle.h
          key: ${{ runner.os }}-test-build-${{ github.run_id }}
          fail-on-cache-miss: true

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Build Docker image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: hg-engine
          tags: hg-engine
          load: true
          cache-from: type=gha

      - name: Run tests (shard ${{ matrix.shard }})
        working-directory: hg-engine
        env:
          SHARD: ${{ matrix.shard }}
        run: |
          docker run \
            --cap-drop ALL \
            --env HOME=/tmp \
            --env SDL_VIDEODRIVER=dummy \
            --env SHARD \
            --mount type=bind,source="$PWD",destination=/hg-engine \
            --rm \
            --security-opt no-new-privileges \
            --user "$(id -u):$(id -g)" \
            hg-engine bash -c '
              . .venv/bin/activate
              for k in 0 1 2 3; do
                TEST_RUNNER_PARTITION_COUNT=20 TEST_RUNNER_PARTITION_INDEX=$((SHARD * 4 + k)) python3 -u scripts/run_tests.py -c > "partition-$k.log" 2>&1 &
              done
              status=0
              for pid in $(jobs -p); do wait "$pid" || status=1; done
              cat partition-*.log
              exit $status'
