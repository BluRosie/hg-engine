name: pr-lint

on:
  pull_request:
    paths:
      - 'src/**/*.c'
      - 'include/**/*.h'

jobs:
  pr-lint:
    if: ${{ github.repository == 'BluRosie/hg-engine' }}
    runs-on: ubuntu-latest

    permissions:
      contents: read
      pull-requests: read

    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Run formatter and report any failure
        run: |
          ./.githooks/pre-commit
          git diff --staged --name-only |
          while IFS= read -r f; do
            if [ -f "$f" ] && [[ "$f" =~ ^(src/.+\.c|include/.+\.h)$ ]]; then
              echo "File diffs failing:\n"
              git diff --staged
              exit 1
            fi
          done

          exit 0
