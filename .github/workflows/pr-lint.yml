name: pr-lint

on:
  pull_request:
    paths:
      - 'src/**/*.c'
      - 'include/**/*.h'

jobs:
  pr-lint:
    if: ${{ github.repository == 'BluRosie/hg-engine' }}
    runs-on: ubuntu-26.04

    permissions:
      contents: read

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Run formatter and report any failure
        run: |
          ./.githooks/pre-commit
          git diff --staged --name-only |
          while IFS= read -r f; do
            if [ -f "$f" ] && [[ "$f" =~ ^(src/.+\.c|include/.+\.h)$ ]]; then
              printf 'File diffs failing:\n\n'
              git diff --staged
              exit 1
            fi
          done

          exit 0
